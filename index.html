<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="جذور: البحث في جذور القرآن الكريم وتكرارها في السور والأجزاء والمجموعات والمواضيع."></head><body>
<title>جذور</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* تخطيط: شريط تنقل علوي ثابت، ثم مساحة عمل واحدة؛ الجداول والخرائط تمرر داخل حاوياتها */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --fg: #141a29;
  --muted: #586377;
  --line: #dbe0e9;
  --accent: #1f4fd1;
  --accent-soft: #e3eafc;
  --c2: #e0590b;
  --makki: #1f4fd1;
  --madani: #0d9b72;
  --gold: #9a6b00;
  --gold-soft: #fdeeb8;
  --danger: #b42318;
  --h0: #fff6d5; --h1: #fdd062; --h2: #f9973a; --h3: #e2502b; --h4: #b0184c; --h5: #5c0c5e;
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --f-quran: "Amiri Quran", "Amiri", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1119; --surface: #151b27; --fg: #e7ebf3; --muted: #9aa4b8; --line: #283245;
    --accent: #6f9bff; --accent-soft: #1b2846; --c2: #ff8a3d; --makki: #6f9bff; --madani: #34d3a5;
    --gold: #f2c14e; --gold-soft: #3b2f0f; --danger: #ff8b80;
    --h0: #2b2346; --h1: #50297d; --h2: #93308f; --h3: #d6455e; --h4: #f7883f; --h5: #fde68a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1119; --surface: #151b27; --fg: #e7ebf3; --muted: #9aa4b8; --line: #283245;
  --accent: #6f9bff; --accent-soft: #1b2846; --c2: #ff8a3d; --makki: #6f9bff; --madani: #34d3a5;
  --gold: #f2c14e; --gold-soft: #3b2f0f; --danger: #ff8b80;
  --h0: #2b2346; --h1: #50297d; --h2: #93308f; --h3: #d6455e; --h4: #f7883f; --h5: #fde68a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.app { direction: rtl; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 26px; color: var(--accent); line-height: 1; }
nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
nav button { font: inherit; background: none; border: 0; padding: 6px 11px; border-radius: 6px; color: var(--muted); cursor: pointer; }

nav button:hover { color: var(--fg); }
.theme { font: inherit; font-size: 13px; background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 4px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.theme svg { width: 15px; height: 15px; }
/* على الجوال: الشريط لا يلحق الصفحة عند النزول، والأقسام في سطر واحد يُسحب أفقيًا */
@media (max-width: 900px) {
  header.top { position: static; }

  nav { order: 3; flex: 0 0 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  nav::-webkit-scrollbar { display: none; }

}
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.wrap > *, .home2 > *, .home3 > *, .grid2 > * { min-width: 0; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

input[type=text], select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; max-width: 100%; }

.btn { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.btn.ghost { background: none; color: var(--accent); }
.btn.small { padding: 2px 8px; font-size: 13px; }
.btn.danger { border-color: var(--danger); color: var(--danger); background: none; }

.scroll { overflow-x: auto; }

.bar { height: 10px; background: linear-gradient(to left, var(--accent), var(--h3)); border-radius: 3px; min-width: 3px; }

.sc.md { border-inline-start-color: var(--madani); }
.sc.jz { border-inline-start-color: var(--h3); }
.sc:hover { border-color: var(--accent); }
.sc .n { font-family: var(--f-quran); font-size: 20px; line-height: 1.3; }

.lemma .c { font-size: 12px; color: var(--muted); }
.lemma .p { font-size: 11px; color: var(--muted); }
.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stat b { display: block; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
.stat.c2 b { color: var(--c2); }
.stat span { font-size: 12px; color: var(--muted); }

.verse .t span.wd:hover { outline: 1px dashed var(--muted); }
.ana { border: 1px solid var(--gold); background: var(--gold-soft); border-radius: 8px; padding: 10px 14px; display: grid; gap: 4px; font-size: 14px; }

.pill .w { font-family: var(--f-quran); font-size: 19px; }
.pill button { border: 0; background: none; color: var(--danger); cursor: pointer; font: inherit; padding: 0 2px; }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 4px 12px; max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.pickgrid label { font-size: 14px; }
.empty { color: var(--muted); padding: 12px 0; }

.chart { position: relative; height: 260px; min-width: 0; }
.chart.tall { height: 380px; }
.chart.short { height: 220px; }
canvas { display: block; }
#tip { position: fixed; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 13px; padding: 4px 8px; border-radius: 4px; z-index: 20; white-space: nowrap; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 140px; height: 12px; border-radius: 2px; background: linear-gradient(to left, var(--h0), var(--h1), var(--h2), var(--h3), var(--h4), var(--h5)); }
.key { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.key i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; }
.gt td { vertical-align: middle; }
.gt td.root { line-height: 1; }
.gt td.hc { text-align: center; min-width: 38px; font-size: 13px; padding: 4px 6px; }
.gt td.hc.z { color: var(--muted); }
.gt th.sh { font-family: var(--f-quran); font-size: 15px; text-align: center; }
/* الرئيسية: صف أرقام، ثم رسم عريض وحلقة، ثم الأقسام والملاحظات */
.hero { display: grid; gap: 14px; padding: 28px 24px; border-radius: 14px; border: 1px solid var(--line); background:
  radial-gradient(120% 140% at 100% 0%, var(--accent-soft) 0%, transparent 55%), radial-gradient(90% 120% at 0% 100%, color-mix(in oklab, var(--h2) 18%, transparent) 0%, transparent 60%), var(--surface); }
.hero h1 { font-size: 40px; font-weight: 700; color: var(--accent); }
.hero p { margin: 0; color: var(--muted); max-width: 62ch; }
.hero form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; max-width: 560px; }
.hero input { width: 100%; min-width: 0; font-size: 16px; padding: 10px 14px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.kpi { text-align: right; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 18px; min-height: 150px; cursor: pointer; }
.kpi:hover { border-color: var(--accent); }
.kpi .t { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; color: var(--muted); }
.kpi .v { font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 13px; color: var(--muted); margin-top: auto; }
.badge { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; box-shadow: inset 0 1px 0 rgb(255 255 255 / .25); }
.badge svg { width: 20px; height: 20px; }
.g1 { background: linear-gradient(135deg, #3b6cf0, #1b3fae); } .g2 { background: linear-gradient(135deg, #1fbf8f, #0b7a5a); }
.g3 { background: linear-gradient(135deg, #f8a13d, #d9480f); } .g4 { background: linear-gradient(135deg, #d6457a, #7a1d6b); }
.g5 { background: linear-gradient(135deg, #8a63f0, #4a2bb0); } .g6 { background: linear-gradient(135deg, #36b5d8, #1a6f9e); }
.home2 { display: grid; gap: 12px; grid-template-columns: 2fr 1fr; }
.home3 { display: grid; gap: 12px; grid-template-columns: 2fr 1fr; align-items: start; }
.hero { align-content: start; }
.dots { background-image: radial-gradient(color-mix(in oklab, var(--fg) 14%, transparent) 1px, transparent 1px); background-size: 14px 14px; border-radius: 8px; }
.sec { display: flex; gap: 14px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-inline: 0; border-top: 0; font: inherit; color: var(--fg); text-align: right; width: 100%; }
.sec:hover { background: var(--bg); }
.sec:last-child { border-bottom: 0; }
.sec b { display: block; font-weight: 600; }
.sec span.note { display: block; }
.sec .go { margin-inline-start: auto; color: var(--muted); font-size: 18px; }
.ins { display: grid; gap: 4px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.ins:last-child { border-bottom: 0; }
.ins .lbl { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.ins .big { font-family: var(--f-quran); font-size: 26px; line-height: 1.4; }
.ins a { cursor: pointer; color: var(--accent); }
@media (max-width: 900px) { .home2, .home3 { grid-template-columns: 1fr; } .hero h1 { font-size: 32px; } }
.ky { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ky b { font-family: var(--f-quran); font-weight: 400; font-size: 16px; color: var(--h4); }
.str { font-size: 12px; white-space: nowrap; color: var(--muted); }
.str.s3 { color: var(--h4); font-weight: 600; } .str.s2 { color: var(--h3); } .str.s1 { color: var(--h2); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 4px; }
.cmp-root { font-family: var(--f-quran); font-size: 22px; color: var(--c2); }
@media (max-width: 600px) {
  .brand { font-size: 22px; }

  .verse .t { font-size: 20px; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .sc, .lemma { transition: border-color .15s, background .15s; } }
</style>

<div class="app" dir="rtl" lang="ar">
  <header class="top"><div class="top-in">
    <div class="brand">جذور</div>
    <nav id="nav">
      <button data-v="home" id="nv-home">الرئيسية</button>
      <button data-v="surahs" id="nv-surahs">السور والأجزاء</button>

  <footer class="note" style="max-width:1200px;margin:0 auto;padding:0 16px 32px;line-height:1.8">مصادر البيانات: الصرف والجذور من <a class="link" href="https://corpus.quran.com" target="_blank" rel="noopener">المدونة القرآنية العربية (Quranic Arabic Corpus)</a> بنسخة <a class="link" href="https://github.com/mustafa0x/quran-morphology" target="_blank" rel="noopener">quran-morphology</a>، برخصة GNU GPL. ونص المصحف فيها مأخوذ من <a class="link" href="https://tanzil.net" target="_blank" rel="noopener">مشروع تنزيل</a>. وبيانات السور من quranjson، والأجزاء من quran-api.</footer>

<script>
// شريط يظهر أي خطأ برمجي بدل أن تتوقف الصفحة بصمت
(() => {
  const show = msg => {
    let bar = document.getElementById("errbar");
    if (!bar) {
      bar = document.createElement("div"); bar.id = "errbar"; bar.dir = "rtl";
      bar.style.cssText = "position:fixed;inset:auto 0 0 0;z-index:30;background:var(--danger);color:#fff;font:13px var(--f-body);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))";
      document.body.appendChild(bar);
    }
    bar.textContent = "حدث خطأ في الصفحة، أرسل هذا النص إلى Claude: " + msg;
  };
  window.addEventListener("error", e => show((e.message || "خطأ") + (e.lineno ? " (سطر " + e.lineno + ")" : "")));
  window.addEventListener("unhandledrejection", e => show(String(e.reason && (e.reason.message || e.reason.code) || e.reason)));
})();
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => Number(n).toLocaleString("ar-EG");
const fmt1 = n => Number(n).toLocaleString("ar-EG", { maximumFractionDigits: 1 });
const VIEW = $("#view");
document.documentElement.lang = "ar";

// ---------- المظهر ----------
const THEMES = [["", "تلقائي"], ["light", "فاتح"], ["dark", "داكن"]];
let theme = "";
try { theme = localStorage.getItem("jothoor-theme") || ""; } catch (e) {}
function applyTheme() {
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
  const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const auto = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>';
  $("#theme").innerHTML = (theme === "light" ? sun : theme === "dark" ? moon : auto) + "<span>المظهر: " + THEMES.find(t => t[0] === theme)[1] + "</span>";
}
$("#theme").onclick = () => {
  theme = THEMES[(THEMES.findIndex(t => t[0] === theme) + 1) % 3][0];
  try { localStorage.setItem("jothoor-theme", theme); } catch (e) {}
  applyTheme(); render();
};
applyTheme();
try {
  const mq = matchMedia("(prefers-color-scheme: dark)"), onMq = () => { if (!theme) render(); };
  if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq);
} catch (e) {}

// ---------- البيانات ----------
let D, R, L, S, V;
let verseSurah, verseAyah, verseJuz, verseStart, wordVerse, wordSurah, wordJuz, wordRoot, wordPos;
let lemmaWords, lemmaCount, rootTotal, rootLemmas, rootByNorm, surahByOrder;
let BR, lemmaRoot, rootBase;   // الجذور الأصلية، وجذر كل مشتق بعد التقسيم، والجذر الأصلي لكل فرع

const normRoot = s => s.replace(/[\sً-ْٰ]/g, "").replace(/[أإآٱاءؤئ]/g, "ا").replace(/ى/g, "ي");
const POS = { N: "اسم", V: "فعل", P: "حرف" };

function prepare(d) {
  D = d; S = d.s; BR = d.r; R = BR; L = d.l; V = d.v;

}

// عمودان لكل عنصر: النطاق الأول والثاني، لكل ألف كلمة
function pairBars(id, labels, a, b, nameA, nameB, onPick) {
  const el = document.getElementById(id);
  if (el && !labels.length) { el.parentElement.innerHTML = `<div class="empty">لا يوجد ما يتميز به بوضوح بهذه الإعدادات.</div>`; return; }
  mkChart(id, {
    type: "bar",
    data: { labels, datasets: [
      { label: nameA, data: a, backgroundColor: css("--accent"), borderRadius: 3 },
      { label: nameB, data: b, backgroundColor: css("--c2"), borderRadius: 3 }] },
    options: { indexAxis: "y",
      scales: { x: { position: "top", ticks: { callback: numTick } }, y: { position: "right", grid: { display: false }, ticks: { autoSkip: false, font: { family: css("--f-quran"), size: 17 }, color: css("--fg") } } },
      plugins: { legend: { display: true, position: "bottom" }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt1(c.raw)} لكل ألف كلمة` } } },
      onClick: (e, els) => { if (els.length) onPick(els[0].index); },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; } },
  });
}

// ---------- تحليل المجموعة: الجذور المذكورة في كل سورها ----------
function vGroup() {
  if (!prefs.groups.length) { VIEW.innerHTML = `<div><h1>تحليل المجموعة</h1></div><div class="panel"><div class="empty">أنشئ مجموعة أولًا من صفحة المجموعات.</div></div>`; return; }
  let g = prefs.groups.find(x => x.id === st.grpId) || prefs.groups[0];
  st.grpId = g.id;
  const ss = g.surahs.slice().sort((a, b) => a - b), n = ss.length, col = new Int16Array(114).fill(-1);
  ss.forEach((s, i) => col[s] = i);
  const cov = st.grpCov > 0 && st.grpCov <= n ? st.grpCov : n;
  // عدد كل جذر في كل سورة من سور المجموعة
  const M = new Int32Array(n * R.length), tot = new Int32Array(R.length), NS = new Int32Array(n);
  let NA = 0;
  for (let w = 0; w < wordRoot.length; w++) {
    const c = col[wordSurah[w]]; if (c < 0) continue;
    NA++; NS[c]++;
    const r = wordRoot[w]; if (r >= 0) { M[c * R.length + r]++; tot[r]++; }
  }
  const test = scopeTest("g:" + g.id);
  const key = new Map(keyness(test, w => !test(w), "root", 1).rows.map(x => [x.r, x]));
  const ex = exclSet();
  let rows = [];
  for (let r = 0; r < R.length; r++) {
    if (!tot[r] || ex.has(R[r])) continue;
    let k = 0; for (let c = 0; c < n; c++) if (M[c * R.length + r]) k++;
    if (k < cov) continue;
    if (st.grpKeyOnly && !key.has(r)) continue;
    rows.push({ r, k, t: tot[r], key: key.get(r) });
  }
  const allN = rows.length;
  rows.sort(st.grpSort === "key" ? (a, b) => (b.key ? b.key.g : -1) - (a.key ? a.key.g : -1) || b.t - a.t
    : st.grpSort === "min" ? (a, b) => minOf(b) - minOf(a) || b.t - a.t : (a, b) => b.t - a.t);
  function minOf(x) { let m = Infinity; for (let c = 0; c < n; c++) m = Math.min(m, M[c * R.length + x.r] * 1000 / NS[c]); return m; }
  const shown = rows.slice(0, st.grpLimit);
  // تلوين الخانة بكثافة الجذر في السورة (لكل ألف كلمة)
  let mx = 0; for (const x of shown) for (let c = 0; c < n; c++) mx = Math.max(mx, M[c * R.length + x.r] * 1000 / NS[c]);
  const stops = heatStops().map(rgb), lightText = t => t > .55;
  const cell = (x, c) => { const v = M[c * R.length + x.r]; if (!v) return `<td class="hc z">·</td>`; const t = Math.sqrt(v * 1000 / NS[c] / mx);
    return `<td class="hc num" style="background:${heatColor(t, stops)};color:${lightText(t) ? "#fff" : "#1a1a1a"}" title="${esc(S[ss[c]][0])}: ${fmt(v)} (${fmt1(v * 1000 / NS[c])} لكل ألف)">${fmt(v)}</td>`; };
  VIEW.innerHTML = `
    <div><h1>الجذور المشتركة في «${esc(g.name)}»</h1>
    <p class="sub num">${fmt(allN)} جذرًا ورد في ${cov === n ? `كل سور المجموعة (${fmt(n)})` : `${fmt(cov)} سور على الأقل من ${fmt(n)}`}${st.grpKeyOnly ? "، ونسبته في المجموعة أعلى من بقية المصحف" : ""}. الأرقام في الخانات عدد مرات الورود في كل سورة، ولونها بحسب الكثافة.</p></div>
    <div class="panel"><div class="row">
      <label class="f">المجموعة<select id="gp-g">${prefs.groups.map(x => `<option value="${x.id}"${x.id === g.id ? " selected" : ""}>${esc(x.name)} (${x.surahs.length})</option>`).join("")}</select></label>
      <label class="f">يرد في<select id="gp-cov">${Array.from({ length: n }, (_, i) => n - i).map(k => `<option value="${k}"${k === cov ? " selected" : ""}>${k === n ? "كل السور" : fmt(k) + " سور على الأقل"}</option>`).join("")}</select></label>
      <label class="f">الترتيب<select id="gp-sort"><option value="total"${st.grpSort === "total" ? " selected" : ""}>الأكثر تكرارًا في المجموعة</option><option value="key"${st.grpSort === "key" ? " selected" : ""}>الأكثر تميّزًا</option><option value="min"${st.grpSort === "min" ? " selected" : ""}>الأكثر حضورًا في كل سورة</option></select></label>
      <label class="chk"><input type="checkbox" id="gp-key"${st.grpKeyOnly ? " checked" : ""}> المميّزة فقط</label>
      <label class="chk"><input type="checkbox" id="gp-ex"${prefs.exclOn ? " checked" : ""}> تطبيق قائمة الاستبعاد</label>
      <span class="grow"></span><button class="btn ghost" id="gp-csv">تنزيل CSV</button>
    </div></div>
    <div class="panel"><div class="scroll"><table class="gt">
      <thead><tr><th>#</th><th>الجذر</th><th>في كم سورة</th><th>المجموع</th><th>مقارنة ببقية المصحف</th>${ss.map(s => `<th class="sh" title="${esc(S[s][0])}">${esc(S[s][0])}</th>`).join("")}</tr></thead>
      <tbody>${shown.map((x, i) => `<tr><td class="num">${fmt(i + 1)}</td>
        <td class="root"><a data-kr="${x.r}" data-kl="" data-ks="g:${g.id}">${esc(R[x.r])}</a></td>
        <td class="num">${fmt(x.k)}/${fmt(n)}</td><td class="num"><b>${fmt(x.t)}</b></td>
        <td>${x.key ? `<b class="num">${ratioTxt(x.key)}</b> ${strengthHtml(x.key.g)}` : `<span class="note">ليس أعلى من المعتاد</span>`}</td>
        ${ss.map((_, c) => cell(x, c)).join("")}</tr>`).join("") || `<tr><td colspan="${5 + n}" class="empty">لا توجد جذور بهذه الشروط. جرّب «يرد في» عددًا أقل من السور.</td></tr>`}</tbody>
    </table></div>
    ${rows.length > st.grpLimit ? `<div class="pager"><button class="btn ghost" id="gp-more">عرض المزيد (${fmt(rows.length - st.grpLimit)} متبقية)</button></div>` : ""}</div>`;
  $("#gp-g").onchange = e => { st.grpId = e.target.value; st.grpCov = 0; st.grpLimit = 150; render(); };
  $("#gp-cov").onchange = e => { st.grpCov = +e.target.value; st.grpLimit = 150; render(); };
  $("#gp-sort").onchange = e => { st.grpSort = e.target.value; render(); };
  $("#gp-key").onchange = e => { st.grpKeyOnly = e.target.checked; render(); };
  $("#gp-ex").onchange = e => { prefs.exclOn = e.target.checked; savePrefs(); render(); };
  const more = $("#gp-more"); if (more) more.onclick = () => { st.grpLimit += 150; render(); };
  bindKeyLinks();
  $("#gp-csv").onclick = () => downloadCsv("مشترك-" + g.name, ["الجذر", "عدد السور", "المجموع", "النسبة لبقية المصحف", "G2", ...ss.map(s => S[s][0])],
    rows.map(x => [R[x.r], x.k, x.t, x.key && x.key.b ? x.key.ratio.toFixed(2) : "", x.key ? x.key.g.toFixed(2) : "", ...ss.map((_, c) => M[c * R.length + x.r])]));
}

// ---------- مقارنة نطاقين ----------
function vCompare() {
  if (!st.cmpA) st.cmpA = prefs.groups[0] ? "g:" + prefs.groups[0].id : "s:1";
  if (st.cmpB === st.cmpA) st.cmpB = "all";
  const A = st.cmpA, B = st.cmpB, lv = st.keyLevel;
  const tA = scopeTest(A), tB = B === "all" ? (w => !tA(w)) : scopeTest(B);
  const nameB = B === "all" ? "بقية المصحف" : scopeName(B);
  const kAB = keyness(tA, tB, lv, st.keyMin), kBA = keyness(tB, tA, lv, st.keyMin);
  const rA = ranking(A).rows, rB = B === "all" ? null : ranking(B).rows;
  // الجذور المشتركة وأعلى الجذور في كل منهما
  const setA = new Set(rA.map(x => x[0]));
  let shared = 0, nB = 0, wA = 0, wB = 0, ovl = 0;
  const cntA = new Int32Array(R.length), cntB = new Int32Array(R.length);
  for (let w = 0; w < wordRoot.length; w++) {
    const a = tA(w), b = tB(w);
    if (a) wA++; if (b) wB++; if (a && b) ovl++;
    const r = wordRoot[w]; if (r < 0) continue;
    if (a) cntA[r]++; if (b) cntB[r]++;
  }
  const ex = exclSet();
  for (let r = 0; r < R.length; r++) if (cntB[r] && !ex.has(R[r])) { nB++; if (setA.has(r)) shared++; }
  const top = []; const seen = new Set();
  const byA = [...Array(R.length).keys()].filter(r => cntA[r] && !ex.has(R[r])).sort((x, y) => cntA[y] - cntA[x]).slice(0, 8);
  const byB = [...Array(R.length).keys()].filter(r => cntB[r] && !ex.has(R[r])).sort((x, y) => cntB[y] - cntB[x]).slice(0, 8);
  for (const r of [...byA, ...byB]) if (!seen.has(r)) { seen.add(r); top.push(r); }
  VIEW.innerHTML = `
    <div><h1>مقارنة: ${esc(scopeName(A))} و${esc(nameB)}</h1>
    <p class="sub">قارن أي مجموعة أو سورة أو جزء بآخر، أو ببقية المصحف. «يميّز» تعني أن نسبته في أحدهما أعلى بوضوح من نسبته في الآخر.</p></div>
    <div class="panel"><div class="row">
      <label class="f"><span><i class="dot" style="background:var(--accent)"></i> النطاق الأول</span><select id="cp-a">${scopeOptions(A)}</select></label>
      <label class="f"><span><i class="dot" style="background:var(--c2)"></i> النطاق الثاني</span><select id="cp-b"><option value="all"${B === "all" ? " selected" : ""}>بقية المصحف</option>${scopeOptions(B).replace(/<option value="all"[^>]*>[^<]*<\/option>/, "")}</select></label>
      <button class="btn ghost small" id="cp-swap" type="button">تبديل ⇄</button>
      ${levelSelects("cp")}
    </div>
    ${ovl ? `<div class="note">يشترك النطاقان في ${fmt(ovl)} كلمة، وتُحسب في كليهما؛ فيُقارن كل نطاق كاملًا بالآخر.</div>` : ""}</div>
    <div class="panel"><div class="stats">
      <div class="stat"><b>${fmt(wA)}</b><span>كلمة في ${esc(scopeName(A))}</span></div>
      <div class="stat c2"><b>${fmt(wB)}</b><span>كلمة في ${esc(nameB)}</span></div>
      <div class="stat"><b>${fmt(setA.size)}</b><span>جذرًا في الأول</span></div>
      <div class="stat c2"><b>${fmt(nB)}</b><span>جذرًا في الثاني</span></div>
      <div class="stat"><b>${fmt(shared)}</b><span>جذرًا مشتركًا</span></div>
    </div></div>
    <div class="panel"><h2>أكثر الجذور تكرارًا في كلٍّ منهما (لكل ألف كلمة)</h2><div class="chart tall"><canvas id="cp-top"></canvas></div></div>
    <div class="grid2">
      <div class="panel"><h2 style="color:var(--accent)">ما يميّز ${esc(scopeName(A))}</h2><div class="chart tall"><canvas id="cp-ka"></canvas></div></div>
      <div class="panel"><h2 style="color:var(--c2)">ما يميّز ${esc(nameB)}</h2><div class="chart tall"><canvas id="cp-kb"></canvas></div></div>
    </div>
    <div class="panel"><h2>جدول ما يميّز ${esc(scopeName(A))}</h2>${keyTable(kAB.rows, lv, "الأول", "الثاني", 60, A)}</div>
    <div class="panel"><h2>جدول ما يميّز ${esc(nameB)}</h2>${keyTable(kBA.rows, lv, "الثاني", "الأول", 60, B === "all" ? "all" : B)}</div>`;
  $("#cp-a").onchange = e => { st.cmpA = e.target.value; render(); };
  $("#cp-b").onchange = e => { st.cmpB = e.target.value; render(); };
  $("#cp-swap").onclick = () => { if (B === "all") return; [st.cmpA, st.cmpB] = [B, A]; render(); };
  if (B === "all") $("#cp-swap").disabled = true;
  bindLevel("cp"); bindKeyLinks();
  pairBars("cp-top", top.map(r => R[r]), top.map(r => +(cntA[r] * 1000 / Math.max(wA, 1)).toFixed(2)), top.map(r => +(cntB[r] * 1000 / Math.max(wB, 1)).toFixed(2)), scopeName(A), nameB, i => openRoot(top[i], A));
  const ka = kAB.rows.slice(0, 12), kb = kBA.rows.slice(0, 12);
  pairBars("cp-ka", ka.map(x => keyName(x, lv)), ka.map(x => +x.pa.toFixed(2)), ka.map(x => +x.pb.toFixed(2)), scopeName(A), nameB, i => openRoot(ka[i].r, A, lv === "lemma" ? ka[i].k : null));
  const kbScope = B === "all" ? "all" : B;
  // في الرسم الثاني نُبقي ترتيب الألوان: الأول أزرق والثاني برتقالي
  pairBars("cp-kb", kb.map(x => keyName(x, lv)), kb.map(x => +x.pb.toFixed(2)), kb.map(x => +x.pa.toFixed(2)), scopeName(A), nameB, i => openRoot(kb[i].r, kbScope, lv === "lemma" ? kb[i].k : null));
}

// أعمدة أفقية لأعلى الجذور، ملونة بتدرج
function topBars(id, top, onPick) {
  const pal = heatStops();
  mkChart(id, {
    type: "bar",
    data: { labels: top.map(([r]) => R[r]), datasets: [{ data: top.map(([, c]) => c), backgroundColor: top.map((_, i) => pal[Math.min(5, 1 + Math.floor(i / top.length * 5))]), borderRadius: 4 }] },
    options: {
      indexAxis: "y",
      scales: { x: { position: "top", ticks: { callback: numTick } }, y: { position: "right", grid: { display: false }, ticks: { autoSkip: false, font: { family: css("--f-quran"), size: 17 }, color: css("--fg") } } },
      plugins: { tooltip: { callbacks: { label: c => fmt(c.raw) + " مرة" } } },
      onClick: (e, els) => { if (els.length) onPick(top[els[0].index][0]); },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; },
    },
  });
}

function openRoot(r, scope = "all", lemma = null) {
  st.root = r; st.rootSel = new Set(lemma == null ? rootLemmas[r] : [lemma]); st.rootScope = scope; st.rootPage = 0; st.ana = null;
  if (st.cmp === r) st.cmp = -1;
  setView("root");
}

const PAGE = 40;

      ${pages > 1 ? `<div class="pager"><button class="btn ghost small" id="pg-prev"${st.rootPage ? "" : " disabled"}>السابق</button><span class="num note">صفحة ${fmt(st.rootPage + 1)} من ${fmt(pages)}</span><button class="btn ghost small" id="pg-next"${st.rootPage < pages - 1 ? "" : " disabled"}>التالي</button></div>` : ""}

function bindMeaning(r) {
  const b = rootBase[r];
  VIEW.querySelectorAll("[data-sib]").forEach(x => x.onclick = () => openRoot(+x.dataset.sib, st.rootScope));
  const e = $("#mn-edit");
  if (e) e.onclick = () => {
    const cur = (prefs.splits || DEFAULT_SPLITS).find(x => x.root === BR[b]);
    const branches = cur ? cur.branches.map(x => ({ name: x.name })) : [{ name: "" }, { name: "" }];
    const assign = {};
    for (const l of baseLemmas(b)) { const i = cur ? cur.branches.findIndex(x => x.lemmas.includes(lemmaKey(l))) : -1; if (i >= 0) assign[l] = i; }
    st.splitEdit = { base: b, branches, assign }; render();
  };
  const ed = st.splitEdit && st.splitEdit.base === b ? st.splitEdit : null;
  if (!ed) return;
  const keepNames = () => VIEW.querySelectorAll("[data-bn]").forEach(x => ed.branches[+x.dataset.bn].name = x.value.trim());
  VIEW.querySelectorAll("[data-la]").forEach(x => x.onchange = () => { const v = +x.value; if (v < 0) delete ed.assign[+x.dataset.la]; else ed.assign[+x.dataset.la] = v; });
  $("#mn-add").onclick = () => { keepNames(); ed.branches.push({ name: "" }); render(); };
  $("#mn-cancel").onclick = () => { st.splitEdit = null; render(); };
  const write = list => { prefs.splits = list; st.splitEdit = null; savePrefs(); applySplits(); };
  const others = () => (prefs.splits || DEFAULT_SPLITS).filter(x => x.root !== BR[b]).map(x => JSON.parse(JSON.stringify(x)));
  const drop = $("#mn-drop");
  if (drop) drop.onclick = () => { const l0 = rootLemmas[r][0]; write(others()); openRoot(lemmaRoot[l0], st.rootScope); };
  $("#mn-save").onclick = () => {
    keepNames();
    const used = ed.branches.map((br, i) => ({ name: br.name || "المعنى " + (i + 1), lemmas: baseLemmas(b).filter(l => ed.assign[l] === i).map(lemmaKey) })).filter(x => x.lemmas.length);
    if (!used.length) { $("#mn-msg").textContent = "اختر معنى لمشتق واحد على الأقل."; return; }
    const names = used.map(x => x.name);
    if (new Set(names).size !== names.length) { $("#mn-msg").textContent = "اجعل لكل معنى اسمًا مختلفًا."; return; }
    const l0 = rootLemmas[r][0];
    write([...others(), { root: BR[b], branches: used }]);
    openRoot(lemmaRoot[l0], st.rootScope);
  };
}

// يبحث عن جذر بحروفه أو بكلمة من المصحف ثم يستدعي pick
function findRoot(q, msg, pick) {
  q = (q || "").trim();
  if (!q) return;
  const n = normRoot(q);
  if (rootByNorm.has(n)) { pick(rootByNorm.get(n)); return; }
  // الألف الخنجرية تُقرأ ألفًا (المنٰفقون = المنافقون) وقد تُكتب بدونها (هٰذا = هذا)، فنجرب الوجهين
  const plain = s => normRoot(s.replace(/[ۖ-ۭ]/g, "")), plainA = s => normRoot(s.replace(/[ۖ-ۭ]/g, "").replace(/ٰ/g, "ا"));
  const counts = new Map();
  const forms = new Set([n, "ال" + n, "و" + n, "وال" + n, "ف" + n, "ب" + n, "بال" + n, "لل" + n]);
  for (let w = 0; w < wordRoot.length; w++) {
    const r = wordRoot[w]; if (r < 0) continue;
    const v = wordVerse[w];
    const tw = V[v].split(" ")[w - verseStart[v]];
    if (forms.has(plain(tw)) || forms.has(plainA(tw))) counts.set(r, (counts.get(r) || 0) + 1);
  }
  if (counts.size === 1) { pick([...counts.keys()][0]); return; }
  if (counts.size > 1) {
    msg.innerHTML = "الكلمة تعود إلى أكثر من جذر: " + [...counts].sort((a, b) => b[1] - a[1]).map(([r, c]) => `<a class="link" data-pick="${r}" style="font-family:var(--f-quran);font-size:19px">${esc(R[r])}</a> (${fmt(c)})`).join("، ");
    msg.querySelectorAll("[data-pick]").forEach(a => a.onclick = () => pick(+a.dataset.pick));
    return;
  }
  msg.textContent = "لم أجد جذرًا أو كلمة مطابقة. جرّب كتابة الجذر بحروفه، أو اختر من القائمة المقترحة.";
}

// ---------- الخريطة الحرارية ----------
const tip = $("#tip");
function showTip(e, text) { tip.hidden = false; tip.textContent = text; const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8); tip.style.left = Math.max(8, x) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
function hideTip() { tip.hidden = true; }
function heatStops() { return ["--h0", "--h1", "--h2", "--h3", "--h4", "--h5"].map(css); }
function rgb(c) {
  if (c.startsWith("#")) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  const m = c.match(/\d+/g) || [0, 0, 0]; return m.slice(0, 3).map(Number);
}
function heatColor(t, stops) {
  const p = Math.max(0, Math.min(1, t)) * (stops.length - 1), i = Math.min(Math.floor(p), stops.length - 2), f = p - i;
  const a = stops[i], b = stops[i + 1];
  return `rgb(${Math.round(a[0] + (b[0] - a[0]) * f)},${Math.round(a[1] + (b[1] - a[1]) * f)},${Math.round(a[2] + (b[2] - a[2]) * f)})`;
}

function vMap() {
  const ax = st.axis, test = scopeTest(st.mapScope);
  const { rows } = ranking(st.mapScope);
  const top = rows.slice(0, st.mapN).map(x => x[0]);
  const uw = unitWords(ax, test);
  const cols = []; for (let k = 0; k < unitCount(ax); k++) if (uw[k]) cols.push(k);
  VIEW.innerHTML = `
    <div><h1>الخريطة الحرارية</h1><p class="sub">أكثر الجذور تكرارًا (بعد الاستبعاد) في ${esc(scopeName(st.mapScope))}، وكثافتها في كل ${ax === "juz" ? "جزء" : "سورة"}. اضغط خلية لفتح مواضع الجذر فيها.</p></div>
    <div class="panel"><div class="row">
      ${axisSelect("mp-axis", ax)}
      <label class="f">النطاق<select id="mp-scope">${scopeOptions(st.mapScope, { surahs: false, juz: ax !== "juz" })}</select></label>
      <label class="f">عدد الجذور<select id="mp-n">${[20, 30, 50, 80].map(n => `<option${n === st.mapN ? " selected" : ""}>${n}</option>`).join("")}</select></label>
      <label class="f">المقياس<select id="mp-m"><option value="per"${st.metric === "per" ? " selected" : ""}>لكل ألف كلمة</option><option value="cnt"${st.metric === "cnt" ? " selected" : ""}>العدد</option></select></label>
      <span class="grow"></span><div class="legend"><span>أقل</span><i></i><span>أكثر</span></div>
    </div></div>
    <div class="panel"><div class="scroll" id="heat-wrap"><canvas id="heat"></canvas></div></div>`;
  $("#mp-axis").onchange = e => { st.axis = e.target.value; if (st.axis === "juz" && st.mapScope.startsWith("j:")) st.mapScope = "all"; render(); };
  $("#mp-scope").onchange = e => { st.mapScope = e.target.value; render(); };
  $("#mp-n").onchange = e => { st.mapN = +e.target.value; render(); };
  $("#mp-m").onchange = e => { st.metric = e.target.value; render(); };
  // جدول القيم: جذر × وحدة
  const nU = unitCount(ax);
  const grid = top.map(r => unitDist(rootWords(r), ax, test));
  const val = (i, k) => st.metric === "per" ? grid[i][k] * 1000 / uw[k] : grid[i][k];
  let max = 0; top.forEach((_, i) => cols.forEach(k => { max = Math.max(max, val(i, k)); }));
  const c = $("#heat"), wrap = $("#heat-wrap");
  const labW = 74, rowH = 24;
  const avail = Math.max(300, wrap.clientWidth - labW - 8);
  const cell = Math.max(9, Math.min(40, Math.floor(avail / Math.max(cols.length, 1))));
  const longLab = cell >= 22 && ax !== "juz";
  const headH = longLab ? 74 : 30;
  const W = labW + cols.length * cell + 8, H = headH + top.length * rowH + 4;
  const dpr = window.devicePixelRatio || 1; c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px";
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const stops = heatStops().map(rgb), empty = css("--bg");
  g.fillStyle = css("--muted"); g.font = "11px " + css("--f-body"); g.direction = "rtl";
  cols.forEach((k, j) => {
    const x = W - labW - (j + 1) * cell;
    if (longLab) { g.save(); g.translate(x + cell / 2 + 4, headH - 4); g.rotate(-Math.PI / 2); g.textAlign = "right"; g.fillText(unitLabel(k, ax, false).replace(/ \(.*/, ""), 0, 0); g.restore(); }
    else if (cell >= 14 || j % 2 === 0) { g.textAlign = "center"; g.fillText(fmt(+unitLabel(k, ax, true)), x + cell / 2, headH - 8); }
  });
  top.forEach((r, i) => {
    const y = headH + i * rowH;
    g.fillStyle = css("--fg"); g.font = "18px " + css("--f-quran"); g.textAlign = "right"; g.fillText(R[r], W - 4, y + 17);
    cols.forEach((k, j) => {
      const v = val(i, k), x = W - labW - (j + 1) * cell;
      g.fillStyle = v ? heatColor(Math.sqrt(v / max), stops) : empty;
      g.fillRect(x, y + 1, cell - 1, rowH - 2);
    });
  });
  const hit = e => { const rc = c.getBoundingClientRect(); const x = e.clientX - rc.left, y = e.clientY - rc.top; const i = Math.floor((y - headH) / rowH), j = Math.floor((W - labW - x) / cell); return (i >= 0 && i < top.length && j >= 0 && j < cols.length && y >= headH) ? [i, cols[j]] : null; };
  c.onmousemove = e => { const h = hit(e); if (!h) return hideTip(); const n = grid[h[0]][h[1]]; showTip(e, `${R[top[h[0]]]} · ${unitLabel(h[1], ax)}: ${fmt(n)} (${fmt1(n * 1000 / uw[h[1]])} لكل ألف)`); };
  c.onmouseleave = hideTip;
  c.onclick = e => { const h = hit(e); if (h && grid[h[0]][h[1]]) { hideTip(); openRoot(top[h[0]], unitScope(h[1], ax)); } };
  c.style.cursor = "pointer";
}

function vStats() {
  const ax = st.axis, test = scopeTest(st.statScope);
  const { rows, total } = ranking(st.statScope);
  const uw = unitWords(ax, test);
  // تنوع الجذور: عدد الجذور المختلفة لكل مئة كلمة في كل وحدة
  const nU = unitCount(ax), seen = Array.from({ length: nU }, () => new Set()), rootedU = new Int32Array(nU);
  let nouns = 0, verbs = 0, parts = 0, mk = 0, md = 0;
  const mkCnt = new Int32Array(R.length), mdCnt = new Int32Array(R.length);

// ---------- المواضيع: مجموعات كلمات وجذور يختارها المستخدم ----------
// عنصر الموضوع إما جذر كامل {t:"r", v: اسم الجذر أو فرعه, b: الجذر الأصلي} أو مشتق واحد {t:"l", v: "المشتق|النوع", b: الجذر الأصلي}
function itemLemmas(it) {
  const b = BR.indexOf(it.b);
  if (it.t === "r") { const r = R.indexOf(it.v); return r >= 0 ? rootLemmas[r] : b >= 0 ? baseLemmas(b) : []; }
  return b >= 0 ? baseLemmas(b).filter(l => lemmaKey(l) === it.v) : [];
}
const itemLabel = it => it.t === "r" ? it.v : it.v.split("|")[0];
function itemWords(it) { const a = []; for (const l of itemLemmas(it)) for (const w of lemmaWords[l]) a.push(w); return a; }
function topicWords(t) {
  const mark = new Uint8Array(wordRoot.length);
  for (const it of t.items) for (const w of itemWords(it)) mark[w] = 1;
  const a = []; for (let w = 0; w < mark.length; w++) if (mark[w]) a.push(w);
  return a;
}
// الأرجحية اللوغاريتمية لوحدة واحدة مقارنة ببقية المصحف
function g2(a, NA, b, NB) {
  const N = NA + NB; if (!NA || !NB || !(a + b)) return 0;
  const E1 = NA * (a + b) / N, E2 = NB * (a + b) / N;
  return 2 * ((a ? a * Math.log(a / E1) : 0) + (b ? b * Math.log(b / E2) : 0));
}
function keyCell(a, NA, b, NB) {
  if (!a) return `<span class="note">لا يرد</span>`;
  const ratio = (a / NA) / (Math.max(b, 0.5) / NB), g = g2(a, NA, b, NB);
  if (a / NA <= b / NB) return `<span class="note num">×${fmt1(ratio)} · أقل من المعتاد</span>`;
  return `<b class="num">${b ? "×" + fmt1(ratio) : "لا يرد في غيره"}</b> ${g >= 3.84 ? strengthHtml(g) : `<span class="note">ضمن المعتاد</span>`}`;
}

  }
  const list = `<div class="panel"><div class="row"><h2>مواضيعك</h2><span class="grow"></span>${ed ? "" : `<button class="btn" id="tp-new">موضوع جديد</button>`}</div>

  if (t && t.items.length) {

    let units = [];
    for (let k = 0; k < nU; k++) if (ud[k] || st.topicAll) units.push({ k, a: ud[k], per: ud[k] * 1000 / uw[k], g: ud[k] / uw[k] > (total - ud[k]) / (N - uw[k]) ? g2(ud[k], uw[k], total - ud[k], N - uw[k]) : -1 });

    if (so === "cnt") units.sort((x, y) => y.a - x.a); else if (so === "per") units.sort((x, y) => y.per - x.per); else if (so === "key") units.sort((x, y) => y.g - x.g || y.a - x.a);
    const showItems = its.length > 1 && its.length <= 12;
    const itemHead = showItems ? its.map(x => `<th class="sh" style="font-family:var(--f-quran);font-size:16px">${esc(itemLabel(x.it))}</th>`).join("") : "";
    // المجموعات
    const gRows = prefs.groups.map(g => {
      const set = new Uint8Array(114); g.surahs.forEach(s => set[s] = 1);
      let NA = 0; for (let s = 0; s < 114; s++) if (set[s]) NA += S[s][3];
      let a = 0; const hitS = new Set(); for (const w of words) if (set[wordSurah[w]]) { a++; hitS.add(wordSurah[w]); }
      const per = its.map(x => { let c = 0; for (const w of x.words) if (set[wordSurah[w]]) c++; return c; });
      return { g, NA, a, cov: hitS.size, per };
    });
    // المواضع
    const test = scopeTest(st.topicScope), inScope = words.filter(test), hitSet = new Set(inScope);
    const verses = []; for (const w of inScope) { const v = wordVerse[w]; if (verses[verses.length - 1] !== v) verses.push(v); }
    const pages = Math.ceil(verses.length / PAGE); st.topicPage = Math.min(st.topicPage, Math.max(pages - 1, 0));
    const pv = verses.slice(st.topicPage * PAGE, st.topicPage * PAGE + PAGE);
    body = `
    <div class="panel"><div class="row"><h2>«${esc(t.name)}»</h2><span class="note">${t.items.map(it => esc(itemLabel(it))).join("، ")}</span></div>
      <div class="stats">
        <div class="stat"><b>${fmt(total)}</b><span>موضعًا في المصحف</span></div>
        <div class="stat"><b>${fmt1(total * 1000 / N)}</b><span>لكل ألف كلمة</span></div>
        <div class="stat"><b>${fmt(surahN)}</b><span>سورة</span></div>
        <div class="stat"><b>${fmt(juzN)}</b><span>جزءًا</span></div>
        <div class="stat"><b>${fmt(mk)}</b><span>في المكي</span></div>
        <div class="stat"><b>${fmt(total - mk)}</b><span>في المدني</span></div>
      </div>
      ${its.length > 1 ? `<div class="note">حصة كل عنصر من الموضوع</div><div class="chart short"><canvas id="tp-items"></canvas></div>` : ""}
    </div>
    <div class="panel">
      <div class="row"><h2>التوزيع</h2><span class="grow"></span>${axisSelect("tp-axis", ax)}
        <label class="f">المقياس<select id="tp-metric"><option value="cnt"${st.metric === "cnt" ? " selected" : ""}>العدد</option><option value="per"${st.metric === "per" ? " selected" : ""}>لكل ألف كلمة</option></select></label>
        <label class="f"><span><i class="dot" style="background:var(--c2)"></i> قارن بموضوع آخر</span><select id="tp-cmp"><option value="">بلا مقارنة</option>${T.filter(x => x.id !== t.id).map(x => `<option value="${x.id}"${t2 && t2.id === x.id ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label></div>
      <div class="chart"><canvas id="tp-dist"></canvas></div>
      <div class="note">${ax === "juz" ? "الجزء الأول على اليمين." : ax === "nuzul" ? "أول السور نزولًا على اليمين." : "الفاتحة على اليمين."} اضغط عمودًا لعرض مواضعه.</div>
      ${t2 ? `<div class="note num">«${esc(t.name)}»: ${fmt(total)} موضعًا في ${fmt(surahN)} سورة · «${esc(t2.name)}»: ${fmt(w2.length)} موضعًا في ${fmt(new Set(w2.map(w => wordSurah[w])).size)} سورة · اجتمعا في ${fmt([...new Set(words.map(w => wordSurah[w]))].filter(s => w2.some(w => wordSurah[w] === s)).length)} سورة.</div>` : ""}
    </div>
    <div class="panel">
      <h2>في مجموعاتك</h2>
      ${prefs.groups.length ? `<div class="scroll"><table class="gt"><thead><tr><th>المجموعة</th><th>الورود</th><th>لكل ألف كلمة</th><th>سور ورد فيها</th><th>مقارنة ببقية المصحف</th>${itemHead}</tr></thead><tbody>
        ${gRows.map(x => `<tr><td><a class="link" data-tgs="g:${x.g.id}">${esc(x.g.name)}</a></td><td class="num"><b>${fmt(x.a)}</b></td><td class="num">${fmt1(x.a * 1000 / x.NA)}</td>
          <td class="num">${fmt(x.cov)}/${fmt(x.g.surahs.length)}</td><td>${keyCell(x.a, x.NA, total - x.a, N - x.NA)}</td>${showItems ? x.per.map(c => `<td class="num" style="text-align:center">${c ? fmt(c) : "·"}</td>`).join("") : ""}</tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">أنشئ مجموعات سور من صفحة المجموعات لترى ورود الموضوع في كل منها.</div>`}
    </div>
    <div class="panel">
      <div class="row"><h2>${ax === "juz" ? "في كل جزء" : "في كل سورة"}</h2><span class="grow"></span>
        <label class="f">الترتيب<select id="tp-sort"><option value="cnt"${so === "cnt" ? " selected" : ""}>الأكثر ورودًا</option><option value="per"${so === "per" ? " selected" : ""}>الأعلى نسبة (لكل ألف)</option><option value="key"${so === "key" ? " selected" : ""}>الأكثر تميّزًا</option><option value="ord"${so === "ord" ? " selected" : ""}>${ax === "juz" ? "ترتيب الأجزاء" : ax === "nuzul" ? "ترتيب النزول" : "ترتيب المصحف"}</option></select></label>
        <label class="chk"><input type="checkbox" id="tp-all"${st.topicAll ? " checked" : ""}> أظهر ما لم يرد فيه</label>
        <button class="btn ghost" id="tp-csv">تنزيل CSV</button></div>
      <div class="scroll" style="max-height:520px"><table class="gt"><thead><tr><th>#</th><th>${ax === "juz" ? "الجزء" : "السورة"}</th><th>الورود</th><th>لكل ألف كلمة</th><th>مقارنة ببقية المصحف</th>${itemHead}</tr></thead><tbody>
        ${units.map((u, i) => `<tr><td class="num">${fmt(i + 1)}</td><td><a class="link" data-tgs="${unitScope(u.k, ax)}">${esc(unitLabel(u.k, ax))}</a></td><td class="num"><b>${fmt(u.a)}</b></td><td class="num">${fmt1(u.per)}</td>
          <td>${keyCell(u.a, uw[u.k], total - u.a, N - uw[u.k])}</td>${showItems ? uItems.map(d => `<td class="num" style="text-align:center">${d[u.k] ? fmt(d[u.k]) : "·"}</td>`).join("") : ""}</tr>`).join("")}
      </tbody></table></div>
    </div>
    <div class="panel">
      <div class="row"><h2>المواضع · ${esc(scopeName(st.topicScope))} <span class="note num">(${fmt(inScope.length)} في ${fmt(verses.length)} آية)</span></h2><span class="grow"></span>
        <label class="f">النطاق<select id="tp-scope">${scopeOptions(st.topicScope)}</select></label></div>
      <div id="verses">${pv.map(v => verseHtml(v, hitSet)).join("") || `<div class="empty">لا مواضع في هذا النطاق.</div>`}</div>
      ${pages > 1 ? `<div class="pager"><button class="btn ghost small" id="tg-prev"${st.topicPage ? "" : " disabled"}>السابق</button><span class="num note">صفحة ${fmt(st.topicPage + 1)} من ${fmt(pages)}</span><button class="btn ghost small" id="tg-next"${st.topicPage < pages - 1 ? "" : " disabled"}>التالي</button></div>` : ""}
    </div>`;
    st._tp = { t, t2, words, w2, its, units, uw, uItems, ax, total };
  }
  VIEW.innerHTML = `
    <div><h1>المواضيع</h1><p class="sub">اجمع كلمات أو جذورًا مترابطة في موضوع واحد، ثم انظر وروده وتكراره في كل سورة وجزء وفي كل مجموعة من مجموعاتك.</p></div>
    ${editor}${list}${body}`;
  // الأحداث
  const nb = $("#tp-new"); if (nb) nb.onclick = () => { st.topicEdit = { id: null, name: "", items: [], pick: -1 }; render(); };
  VIEW.querySelectorAll("[data-tsel]").forEach(a => a.onclick = () => { st.topicId = a.dataset.tsel; st.topicPage = 0; render(); });
  VIEW.querySelectorAll("[data-te]").forEach(b => b.onclick = () => { const x = T.find(x => x.id === b.dataset.te); st.topicEdit = { id: x.id, name: x.name, items: x.items.map(i => ({ ...i })), pick: -1 }; render(); window.scrollTo(0, 0); });
  VIEW.querySelectorAll("[data-td]").forEach(b => b.onclick = () => { st.confirmDel = "t:" + b.dataset.td; render(); });
  VIEW.querySelectorAll("[data-tdn]").forEach(b => b.onclick = () => { st.confirmDel = null; render(); });
  VIEW.querySelectorAll("[data-tdy]").forEach(b => b.onclick = () => { prefs.topics = T.filter(x => x.id !== b.dataset.tdy); st.confirmDel = null; savePrefs(); render(); });
  if (ed) {
    const keep = () => { ed.name = $("#tp-name").value; };
    $("#tp-form").onsubmit = e => { e.preventDefault(); keep(); findRoot($("#tp-q").value, $("#tp-msg"), x => { ed.pick = x; render(); }); };
    const toggle = it => { keep(); const i = ed.items.findIndex(x => x.t === it.t && x.v === it.v); if (i >= 0) ed.items.splice(i, 1); else ed.items.push(it); render(); };
    VIEW.querySelectorAll("[data-tr]").forEach(b => b.onclick = () => { const r = +b.dataset.tr; toggle({ t: "r", v: R[r], b: BR[rootBase[r]] }); });
    VIEW.querySelectorAll("[data-tl]").forEach(b => b.onclick = () => { const l = +b.dataset.tl; toggle({ t: "l", v: lemmaKey(l), b: BR[L[l][1]] }); });
    VIEW.querySelectorAll("[data-ti]").forEach(b => b.onclick = () => { keep(); ed.items.splice(+b.dataset.ti, 1); render(); });
    $("#tp-cancel").onclick = () => { st.topicEdit = null; render(); };
    $("#tp-save").onclick = () => {
      const name = $("#tp-name").value.trim();
      if (!name) { $("#tp-emsg").textContent = "اكتب اسمًا للموضوع."; return; }
      if (!ed.items.length) { $("#tp-emsg").textContent = "أضف جذرًا أو كلمة واحدة على الأقل."; return; }
      const items = ed.items.map(({ t, v, b }) => ({ t, v, b }));
      if (ed.id) Object.assign(T.find(x => x.id === ed.id), { name, items });
      else { const id = Date.now().toString(36); T.push({ id, name, items }); st.topicId = id; }
      st.topicEdit = null; savePrefs(); render();
    };
  }
  if (!st._tp || !t || !t.items.length) { st._tp = null; return; }
  const P = st._tp; st._tp = null;
  $("#tp-axis").onchange = e => { st.axis = e.target.value; render(); };
  $("#tp-metric").onchange = e => { st.metric = e.target.value; render(); };
  $("#tp-cmp").onchange = e => { st.topicCmp = e.target.value; render(); };
  $("#tp-sort").onchange = e => { st.topicSort = e.target.value; render(); };
  $("#tp-all").onchange = e => { st.topicAll = e.target.checked; render(); };
  $("#tp-scope").onchange = e => { st.topicScope = e.target.value; st.topicPage = 0; render(); };
  const goScope = sc => { st.topicScope = sc; st.topicPage = 0; render(); const p = $("#verses"); if (p) p.scrollIntoView({ block: "start" }); };
  VIEW.querySelectorAll("[data-tgs]").forEach(a => a.onclick = () => goScope(a.dataset.tgs));
  const pp = $("#tg-prev"), pn = $("#tg-next");
  if (pp) pp.onclick = () => { st.topicPage--; render(); };
  if (pn) pn.onclick = () => { st.topicPage++; render(); };
  $("#tp-csv").onclick = () => downloadCsv("موضوع-" + P.t.name, [P.ax === "juz" ? "الجزء" : "السورة", "الورود", "لكل ألف كلمة", "G2", ...P.its.map(x => itemLabel(x.it))],
    P.units.map(u => [unitLabel(u.k, P.ax), u.a, u.per.toFixed(2), u.g > 0 ? u.g.toFixed(2) : "", ...P.uItems.map(d => d[u.k])]));
  const pal = [css("--accent"), css("--c2"), css("--madani"), css("--h4"), css("--gold"), css("--h2"), css("--h5"), css("--muted")];
  if (P.its.length > 1) mkChart("tp-items", { type: "bar", data: { labels: P.its.map(x => itemLabel(x.it)), datasets: [{ data: P.its.map(x => x.words.length), backgroundColor: P.its.map((_, i) => pal[i % pal.length]), borderRadius: 4 }] },
    options: { indexAxis: "y", scales: { x: { ticks: { callback: numTick } }, y: { position: "right", grid: { display: false }, ticks: { autoSkip: false, font: { family: css("--f-quran"), size: 16 }, color: css("--fg") } } },
      plugins: { tooltip: { callbacks: { label: c => fmt(c.raw) + " مرة" } } } } });
  const val = d => st.metric === "per" ? Array.from(d, (n, k) => P.uw[k] ? +(n * 1000 / P.uw[k]).toFixed(2) : 0) : Array.from(d);
  const sets = [{ label: P.t.name, data: val(unitDist(P.words, P.ax)), backgroundColor: css("--accent"), borderRadius: 2 }];
  if (P.t2) sets.push({ label: P.t2.name, data: val(unitDist(P.w2, P.ax)), backgroundColor: css("--c2"), borderRadius: 2 });
  mkChart("tp-dist", { type: "bar",
    data: { labels: Array.from({ length: unitCount(P.ax) }, (_, k) => unitLabel(k, P.ax, true)), datasets: sets },
    options: { scales: { x: { reverse: true, grid: { display: false }, ticks: { autoSkip: true, maxRotation: 0 } }, y: { position: "right", beginAtZero: true, ticks: { callback: numTick } } },
      plugins: { legend: { display: !!P.t2 }, tooltip: { callbacks: { title: it => unitLabel(it[0].dataIndex, P.ax), label: c => `${c.dataset.label}: ${st.metric === "per" ? fmt1(c.raw) + " لكل ألف" : fmt(c.raw)}` } } },
      onClick: (e, els) => { if (els.length) goScope(unitScope(els[0].index, P.ax)); },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; } } });
}

// ---------- الاستبعاد ----------
function vExcl() {
  const sug = SUGGESTED.filter(r => R.includes(r) && !prefs.excl.includes(r));
  VIEW.innerHTML = `
    <div><h1>الجذور المستبعدة</h1><p class="sub">هذه الجذور لا تظهر في ترتيب الأكثر تكرارًا ولا في الخريطة والإحصاءات. حروف الجر والضمائر ليس لها جذر أصلًا فهي خارج الترتيب دائمًا.</p></div>
    <div class="panel">
      <label class="chk"><input type="checkbox" id="ex-on"${prefs.exclOn ? " checked" : ""}> تطبيق الاستبعاد</label>
      <form class="row" id="ex-form"><input type="text" id="ex-q" list="ex-list" placeholder="أضف جذرًا، مثل: ق و ل" style="flex:1;min-width:160px" autocomplete="off">
        <datalist id="ex-list">${R.map(x => `<option value="${esc(x)}">`).join("")}</datalist><button class="btn" type="submit">إضافة</button></form>
      <div id="ex-msg" class="note"></div>
      <div class="row">${prefs.excl.map((r, i) => `<span class="pill"><span class="w">${esc(r)}</span><span class="note num">${fmt(rootTotal[R.indexOf(r)] || 0)}</span><button data-rm="${i}" aria-label="إزالة ${esc(r)}">×</button></span>`).join("") || `<span class="empty">القائمة فارغة.</span>`}</div>
      ${sug.length ? `<div class="row"><span class="note">مقترحة (جذور عامة كثيرة الورود):</span>${sug.map(r => `<button class="btn small ghost" data-add="${esc(r)}">${esc(r)} +</button>`).join("")}</div>` : ""}
    </div>`;
  $("#ex-on").onchange = e => { prefs.exclOn = e.target.checked; savePrefs(); };
  $("#ex-form").onsubmit = e => {
    e.preventDefault(); const n = normRoot($("#ex-q").value);
    if (!rootByNorm.has(n)) { $("#ex-msg").textContent = "هذا ليس جذرًا موجودًا في المصحف. اختر من القائمة المقترحة أثناء الكتابة."; return; }
    const r = R[rootByNorm.get(n)]; if (!prefs.excl.includes(r)) prefs.excl.push(r); savePrefs(); render();
  };
  VIEW.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { prefs.excl.splice(+b.dataset.rm, 1); savePrefs(); render(); });
  VIEW.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { prefs.excl.push(b.dataset.add); savePrefs(); render(); });
}

// ---------- التصدير ----------
async function saveFile(name, text, type, msgEl) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data: new Blob([text], { type }) }); if (msgEl) msgEl.textContent = "تم الحفظ."; return; }
  } catch (e) { if (e && e.code && e.code !== "unavailable") return; }
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { if (msgEl) msgEl.textContent = "نُسخ المحتوى إلى الحافظة."; }).catch(() => {});
}
async function downloadCsv(name, head, rows) {
  const q = x => { const s = String(x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const text = "﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\n");
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name.replace(/[\\/:*?"<>|«»]/g, "") + ".csv", data: new Blob([text], { type: "text/csv" }) }); return; }
  } catch (e) { if (e && e.code && e.code !== "unavailable") return; }
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
}

// ---------- التشغيل ----------
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => setView(b.dataset.v));
const h = (location.hash || "").slice(1);
if (["home", "surahs", "rank", "root", "map", "stats", "compare", "group", "groups", "topics", "excl"].includes(h)) st.view = h;
loadLocal();
render();
loadChartLib();
fetch("data.json").then(r => r.json()).then(d => {
  prepare(d);
  const r = rootByNorm.get(normRoot("رحم")); st.root = r; st.rootSel = new Set(rootLemmas[r]);
  render();
  connectStore();
}).catch(() => { VIEW.innerHTML = `<div class="loading">تعذّر تحميل البيانات. أعد تحميل الصفحة.</div>`; });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (st.view === "map") render(); }, 200); });
})();
